[package]
name = "ntfy-matrix-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
getrandom = "0.3"
matrix-sdk = { version = "0.18.0", features = ["markdown", "bundled-sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
